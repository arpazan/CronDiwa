services:
  crontab-ui:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./.tmp/crontab-data:/app/data
      - ./.tmp/crontab-logs:/var/log/crontabs
      - ./.tmp/supervisor-logs:/var/log/supervisor
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dev_network

networks:
  dev_network:
    external: true