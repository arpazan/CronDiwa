[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[include]
files = /etc/supervisor/conf.d/*.conf

[program:crond]
command=crond -f -l 7 -c %(ENV_CRON_PATH)s
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/crond.log
stderr_logfile=/var/log/supervisor/crond-error.log

[program:backend]
command=fastify start -l info -a 0.0.0.0 -p 3000 dist/app.js
directory=/app/backend
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend-error.log

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log