services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cron-api
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for development
      - ./src:/app/src
      # Mount cron.d directory to persist cron jobs
      - cron_data:/etc/cron.d
      # Mount logs directory to persist logs
      - log_data:/var/log/crontabs
    environment:
      - NODE_ENV=development
      - TZ=UTC
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=password123
    # Keep the container running
    restart: unless-stopped
    # Add capabilities needed for cron
    cap_add:
      - SYS_TIME
    # Command to run when container starts
    command: npm run dev

volumes:
  cron_data:
  log_data: